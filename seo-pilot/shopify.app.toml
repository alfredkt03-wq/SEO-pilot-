# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "3a2817666654540b47ef99b02f438850"
name = "Metaglow SEO"
handle = "seo-pilot-fixer"
application_url = "https://seo-pilot-l7ay.onrender.com"
embedded = true

[access_scopes]
# SEO title/description + image alt text (write_products)
# Page & blog SEO fields (write_content)
# Redirect manager (write_online_store_navigation)
# Image alt text and compressed image copies (write_files)
scopes = "write_products,write_content,write_online_store_navigation,write_files"

[auth]
redirect_urls = [
  "https://seo-pilot-l7ay.onrender.com/auth/callback",
  "https://seo-pilot-l7ay.onrender.com/auth/shopify/callback",
  "https://seo-pilot-l7ay.onrender.com/api/auth/callback"
]

[webhooks]
api_version = "2025-10"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/webhooks/app/uninstalled"

  # New product autopilot (Premium and above)
  [[webhooks.subscriptions]]
  topics = ["products/create"]
  uri = "/webhooks/products/create"

  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"

  # Mandatory privacy (GDPR) webhooks — required for the Shopify App Store
  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = ["customers/data_request"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = ["customers/redact"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = ["shop/redact"]

[pos]
embedded = false

[build]
automatically_update_urls_on_dev = true
