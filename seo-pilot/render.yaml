# Render deployment blueprint for SEO Pilot.
#
# The database is NOT defined here on purpose — it lives on Neon, whose free
# tier doesn't expire (Render's free Postgres is deleted after 30 days, which
# would sign out every merchant). DATABASE_URL is set manually in the Render
# dashboard from the Neon connection string, so it never lands in this file.
services:
  - type: web
    name: seo-pilot
    runtime: node
    plan: starter
    region: frankfurt
    # `npm run setup` generates the Prisma client and applies migrations to the
    # Neon database, so a schema change ships with the deploy that needs it.
    # --include=dev: NODE_ENV=production (set below) would otherwise make npm
    # skip devDependencies, and the build needs vite, which is one.
    buildCommand: npm install --include=dev && npm run setup && npm run build
    startCommand: npm run start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: NODE_ENV
        value: production
      # Set these in the Render dashboard (Environment tab) — never in this file:
      #   DATABASE_URL         Neon connection string (direct/unpooled)
      #   SHOPIFY_API_KEY      from shopify.app.toml (client_id)
      #   SHOPIFY_API_SECRET   from the Shopify Partner dashboard
      #   SHOPIFY_APP_URL      https://<your-service>.onrender.com
      #   SCOPES               write_products,write_content,write_online_store_navigation,write_files
      #   ANTHROPIC_API_KEY    AI writing (console.anthropic.com) — optional; without
      #                        it the AI buttons are hidden
      #   PAGESPEED_API_KEY    optional free Google key for the speed test
      #   GOOGLE_CLIENT_ID     Search Console (console.cloud.google.com) — optional;
      #   GOOGLE_CLIENT_SECRET without these, Search Console just says it's not set up
      - key: DATABASE_URL
        sync: false
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
      - key: SCOPES
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PAGESPEED_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
